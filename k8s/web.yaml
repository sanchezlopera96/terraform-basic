apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventosvivos-web
  namespace: eventosvivos
  labels: { app: eventosvivos-web }
spec:
  replicas: 2
  selector:
    matchLabels: { app: eventosvivos-web }
  template:
    metadata:
      labels: { app: eventosvivos-web }
    spec:
      containers:
        - name: web
          image: ghcr.io/sanchezlopera96/eventosvivos-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: eventosvivos-web
  namespace: eventosvivos
spec:
  selector: { app: eventosvivos-web }
  ports:
    - port: 80
      targetPort: 8080
